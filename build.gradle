// The momentum root project is a pure aggregator for the modules/ subprojects. It
// must NOT apply java-library/maven-publish here — that would surface an empty
// root java module alongside the real momentum-* modules.
subprojects {
  apply plugin: 'java-library'
  apply plugin: 'maven-publish'

  // Subprojects do not inherit group/version from the root project; set them
  // explicitly so composite-build substitution (and publication) uses
  // net.momentum:momentum-<name>:<version> coordinates.
  group = 'net.momentum'
  version = property('momentum_version')

  java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withJavadocJar()
    withSourcesJar()
  }

  repositories { mavenCentral() }

  tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.compilerArgs.add("-Xlint:all")
    it.options.compilerArgs.add("-Werror")
  }

  tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Xdoclint:all,-missing,-html5', true)
    failOnError = false
  }

  tasks.withType(Test).configureEach { useJUnitPlatform() }

  // Shared dependencies, injected into every module from here so the
  // per-module build scripts stay free of boilerplate.
  dependencies {
    compileOnly libs.jspecify
    testCompileOnly libs.jspecify
    implementation libs.fastutil
    implementation libs.jackson.databind
  }

  // Each module publishes as its own artifact: net.momentum:momentum-<name>.
  publishing {
    publications {
      maven(MavenPublication) {
        from components.java
        groupId = 'net.momentum'
        artifactId = project.name
        version = property('momentum_version')
      }
    }
    repositories {
      maven { name = 'Local'; url = rootProject.layout.buildDirectory.dir('repo') }
    }
  }
}

repositories { mavenCentral() }

// Root has no sources of its own; expose lifecycle tasks that aggregate the
// modules so plain `./gradlew build|test|clean` works from the engine root
// (e.g. the engine's own CI).
['build', 'check', 'test', 'clean', 'assemble'].each { name ->
  tasks.register(name) {
    group = 'build'
    description = "Aggregates '$name' across all modules."
    dependsOn subprojects.collect { "${it.path}:$name" }
  }
}
